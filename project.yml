name: TestApp
options:
  bundleIdPrefix: com.test
targets:
  TestApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.test.camarche
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Déverrouiller ta banque"
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1